<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Bar chart: serious-injury share for pedestrians rises from 41% in 40 km/h zones to 65% in 80+ km/h zones.">
  <rect width="640" height="400" fill="#10233f"/>
  <text x="40" y="58" font-family="'DM Mono', monospace" font-size="20" fill="#8ba0ba">SERIOUS INJURY BY SPEED ZONE</text>
  <text x="40" y="84" font-family="'DM Mono', monospace" font-size="15" fill="#6f86a4">Melbourne pedestrians &#183; R + GIS</text>
  <line x1="40" y1="330" x2="600" y2="330" stroke="#2c405c" stroke-width="1.5"/>
  <g fill="#3bb6c0">
    <rect x="60"  y="232.4" width="84" height="97.6"  rx="3" opacity="0.5"/>
    <rect x="166" y="222.8" width="84" height="107.2" rx="3" opacity="0.6"/>
    <rect x="272" y="200.9" width="84" height="129.1" rx="3" opacity="0.7"/>
    <rect x="378" y="177.6" width="84" height="152.4" rx="3" opacity="0.85"/>
  </g>
  <rect x="484" y="174.8" width="84" height="155.2" rx="3" fill="#e07a5f"/>
  <g font-family="'DM Mono', monospace" font-size="24" font-weight="500" fill="#f6f7f9" text-anchor="middle">
    <text x="102" y="220">41%</text>
    <text x="208" y="210">45%</text>
    <text x="314" y="188">54%</text>
    <text x="420" y="165">64%</text>
    <text x="526" y="162">65%</text>
  </g>
  <g font-family="'DM Mono', monospace" font-size="16" fill="#8ba0ba" text-anchor="middle">
    <text x="102" y="358">40</text>
    <text x="208" y="358">50</text>
    <text x="314" y="358">60</text>
    <text x="420" y="358">70</text>
    <text x="526" y="358">80+</text>
  </g>
</svg>
