<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Five-day temperature line chart with rainfall bars, WeatherWise">
  <rect width="640" height="400" fill="#10233f"/>
  <!-- grid -->
  <g stroke="#2a3d5c" stroke-width="1">
    <line x1="70" y1="90" x2="590" y2="90"/>
    <line x1="70" y1="150" x2="590" y2="150"/>
    <line x1="70" y1="210" x2="590" y2="210"/>
    <line x1="70" y1="270" x2="590" y2="270"/>
    <line x1="70" y1="330" x2="590" y2="330"/>
  </g>
  <!-- axis labels -->
  <g fill="#8ba0ba" font-family="'DM Mono', Menlo, monospace" font-size="12">
    <text x="60" y="94" text-anchor="end">25</text>
    <text x="60" y="154" text-anchor="end">20</text>
    <text x="60" y="214" text-anchor="end">15</text>
    <text x="60" y="274" text-anchor="end">10</text>
    <text x="60" y="334" text-anchor="end">5</text>
    <text x="110" y="360" text-anchor="middle">WED</text>
    <text x="220" y="360" text-anchor="middle">THU</text>
    <text x="330" y="360" text-anchor="middle">FRI</text>
    <text x="440" y="360" text-anchor="middle">SAT</text>
    <text x="550" y="360" text-anchor="middle">SUN</text>
  </g>
  <!-- rainfall bars -->
  <g fill="#0e7c86" opacity=".45">
    <rect x="94" y="300" width="32" height="30"/>
    <rect x="204" y="326" width="32" height="4"/>
    <rect x="314" y="270" width="32" height="60"/>
    <rect x="424" y="318" width="32" height="12"/>
    <rect x="534" y="330" width="32" height="0"/>
  </g>
  <!-- band between max and min -->
  <path d="M110 138 L220 102 L330 126 L440 162 L550 186 L550 270 L440 246 L330 222 L220 198 L110 234 Z" fill="#0e7c86" opacity=".18"/>
  <!-- max line -->
  <path d="M110 138 L220 102 L330 126 L440 162 L550 186" fill="none" stroke="#0e7c86" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- min line -->
  <path d="M110 234 L220 198 L330 222 L440 246 L550 270" fill="none" stroke="#aebdd0" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- markers -->
  <g fill="#0e7c86" stroke="#10233f" stroke-width="2">
    <circle cx="110" cy="138" r="5.5"/><circle cx="220" cy="102" r="5.5"/><circle cx="330" cy="126" r="5.5"/><circle cx="440" cy="162" r="5.5"/><circle cx="550" cy="186" r="5.5"/>
  </g>
  <g fill="#aebdd0" stroke="#10233f" stroke-width="2">
    <circle cx="110" cy="234" r="4.5"/><circle cx="220" cy="198" r="4.5"/><circle cx="330" cy="222" r="4.5"/><circle cx="440" cy="246" r="4.5"/><circle cx="550" cy="270" r="4.5"/>
  </g>
  <!-- legend / title -->
  <g font-family="'DM Mono', Menlo, monospace" font-size="12">
    <text x="70" y="44" fill="#0e7c86" letter-spacing="1">04 / PYTHON</text>
    <text x="70" y="64" fill="#f6f7f9" font-family="'Space Grotesk', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">WeatherWise</text>
    <line x1="380" y1="58" x2="404" y2="58" stroke="#0e7c86" stroke-width="3"/>
    <text x="410" y="62" fill="#aebdd0">MAX °C</text>
    <line x1="470" y1="58" x2="494" y2="58" stroke="#aebdd0" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="500" y="62" fill="#aebdd0">MIN °C</text>
  </g>
</svg>
